# ─── LiveKit دوم برای آزمون «حالت رسانهٔ بیرونی» (شبیه LiveKit Cloud) ───
# پورت ۷۸۹۰ با کلیدهای مستقل؛ اپ با NEXT_PUBLIC_LIVEKIT_WS_URL/LIVEKIT_INTERNAL_URL
# به همین نمونه اشاره می‌کند تا مسیر کامل کد بیرونی (توکن/مجوز/اخراج/پایان) آزموده شود
port: 7890
bind_addresses:
  - 0.0.0.0
rtc:
  udp_port: 7892
  tcp_port: 7891
  use_external_ip: false
  congestion_control:
    allow_pause: true
turn:
  enabled: false
room:
  empty_timeout: 600
  max_participants: 64
logging:
  level: info
  json: false
