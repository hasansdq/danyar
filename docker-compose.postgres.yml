services:
  # --- OPTIONAL: PostgreSQL (profile "postgres") ---
  # Activate: .env → DB_PROVIDER=postgres +
  #   DATABASE_URL=postgresql://daniyar:PASS@postgres:5432/daniyar
  # Then: docker compose --profile postgres up -d
  # nextjs waits for this service's healthcheck (depends_on, required: false)
  # and deploy.sh uses `up -d --wait postgres` — no fixed sleeps anywhere.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-daniyar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required when using the postgres profile}
      - POSTGRES_DB=${POSTGRES_DB:-daniyar}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - daniyar
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daniyar} -d ${POSTGRES_DB:-daniyar}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  nextjs:
    depends_on:
      postgres:
        condition: service_healthy
