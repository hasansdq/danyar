name: daniar

# ─── الگوی مشترک بیلد — متغیرهای NEXT_PUBLIC هنگام build ثبت می‌شوند ───
x-build: &daniar-build
  context: .
  args:
    # درگاه یکسان: کلاینت همان دامنه را صدا می‌زند؛ پراکسی داخلی /socket.io و /rtc را می‌فرستد
    NEXT_PUBLIC_SOCKET_URL: /
    NEXT_PUBLIC_SOCKET_PATH: /socket.io
    # آدرس SFU رسانه — خالی = همان‌مبدأ (مسیر /rtc از طریق درگاه 3034)
    # برای سرور رسانه جدا: wss://live.example.com
    NEXT_PUBLIC_LIVEKIT_WS_URL: ${NEXT_PUBLIC_LIVEKIT_WS_URL:-}

# ─── متغیرهای محیطی مشترک — مقادیر امن الزامی از .env مالک ───
x-env: &daniar-env
  NODE_ENV: production
  DATABASE_URL: file:/data/daniar.db
  UPLOAD_DIR: /data/uploads
  # بدون این‌ها کانتینر عمداً بالا نمی‌آید (هیچ کلید پیش‌فرضی وجود ندارد)
  SESSION_SECRET: ${SESSION_SECRET:?در .env مقدار SESSION_SECRET را با «openssl rand -base64 32» بسازید}
  SOCKET_INTERNAL_SECRET: ${SOCKET_INTERNAL_SECRET:?در .env مقدار SOCKET_INTERNAL_SECRET را با «openssl rand -base64 24» بسازید}
  SOCKET_PATH: /socket.io
  # آدرس ارتباط داخلی Next.js → سرویس Socket (نام سرویس در شبکه داخلی Docker)
  SOCKET_INTERNAL_URL: http://socket:3003
  # حالت اجرا برای پنل «وضعیت زیرساخت» مدیر کل — فقط نمایشی (از پنل تغییر نمی‌کند)
  INFRA_RUN_MODE: docker
  # کلاس آنلاین (WebRTC) — signaling و سقف شرکت‌کننده (پیش‌فرض ۳۲؛ ظرفیت اختصاصی
  # هر کلاس و سقف اختصاصی هر مدرسه از پنل «مدیریت کلاس‌های آنلاین» جداگانه تعیین
  # می‌شود و جایگزین همین سقف می‌شود)
  LIVE_MAX_PARTICIPANTS: ${LIVE_MAX_PARTICIPANTS:-32}
  # سقف جهانی جلسات هم‌زمان هر مدرسه (خالی/۰ = نامحدود؛ سقف اختصاصی مدرسه override می‌کند)
  LIVE_MAX_CONCURRENT_SESSIONS: ${LIVE_MAX_CONCURRENT_SESSIONS:-0}
  LIVE_STUN_URLS: ${LIVE_STUN_URLS:-stun:stun.l.google.com:19302}
  LIVE_TURN_URLS: ${LIVE_TURN_URLS:-}
  LIVE_TURN_USERNAME: ${LIVE_TURN_USERNAME:-}
  LIVE_TURN_CREDENTIAL: ${LIVE_TURN_CREDENTIAL:-}
  # پوش مرورگر (Web Push) — کلیدهای VAPID مالک
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  # دستیار هوش مصنوعی — فقط مهلت فراخوانی (پیکربندی ارائه‌دهنده/کلید از پنل مدیر کل)
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
  # ورود پیامکی (OTP) — پیکربندی سرویس از پنل مدیر کل؛ متغیر محیطی اجباری ندارد

  # ─── سرویس رسانه (LiveKit SFU) — کلاس آنلاین با رسانه مستقل ───
  # کلیدها فقط وقتی لازم‌اند که پروفایل media فعال باشد؛ سرویس‌های Next/socket
  # بدون آن‌ها هم بالا می‌آیند (فقط پیام خطای شفاف هنگام ورود به کلاس آنلاین)
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  # آدرس LiveKit از داخل شبکه — برای سرور رسانه جدا آدرس آن سرور را بدهید
  LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-http://livekit:7880}

x-logging: &daniar-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── ۱) آماده‌سازی ولوم پایدار (مالکیت کاربر غیر root) — یک‌باره ───
  init-data:
    image: alpine:3.20
    restart: "no"
    user: root
    volumes:
      - daniar_data:/data
    command:
      - sh
      - -c
      - |
        if [ -f /data/.perms-ok ] && [ "$$(stat -c %u /data 2>/dev/null || echo 0)" = "10001" ]; then
          echo "[init-data] مالکیت ولوم از قبل درست است"
        else
          mkdir -p /data/uploads
          chown -R 10001:10001 /data
          touch /data/.perms-ok
          echo "[init-data] مالکیت ولوم برای کاربر 10001 تنظیم شد"
        fi
    logging: *daniar-logging
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32

  # ─── ۲) مهاجرت ایمن دیتابیس + مدیر کل — یک‌باره و قبل از سرویس‌ها ───
  migrate:
    image: daniar:local
    build: *daniar-build
    command: ["migrate"]
    depends_on:
      init-data:
        condition: service_completed_successfully
    volumes:
      - daniar_data:/data
    environment:
      <<: *daniar-env
      # فقط برای «ساخت اولیه» حساب مدیر کل استفاده می‌شود؛ حساب‌های موجود هرگز تغییر نمی‌کنند
      SUPERADMIN_INITIAL_PASSWORD: ${SUPERADMIN_INITIAL_PASSWORD:?در .env رمز امن اولیه مدیر کل (SUPERADMIN_INITIAL_PASSWORD) را تعیین کنید — حداقل ۱۲ کاراکتر}
    restart: "no"
    logging: *daniar-logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  # ─── ۳) Next.js — فقط شبکه داخلی؛ هیچ پورتی روی میزبان منتشر نمی‌شود ───
  web:
    image: daniar:local
    build: *daniar-build
    command: ["web"]
    depends_on:
      init-data:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
      - daniar_data:/data
    environment: *daniar-env
    healthcheck:
      # بررسی واقعی: پاسخ API + اتصال واقعی به دیتابیس
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    logging: *daniar-logging
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256

  # ─── ۴) Socket.IO — فقط شبکه داخلی؛ هیچ پورتی روی میزبان منتشر نمی‌شود ───
  socket:
    image: daniar:local
    build: *daniar-build
    command: ["socket"]
    depends_on:
      init-data:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
      - daniar_data:/data
    environment: *daniar-env
    healthcheck:
      # بررسی واقعی: /healthz اتصال دیتابیس را هم می‌سنجد
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *daniar-logging
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256

  # ─── ۵) تنها درگاه ورودی پروژه — فقط روی 127.0.0.1:3034 میزبان ───
  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
      socket:
        condition: service_healthy
    ports:
      - "127.0.0.1:3034:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  # ─── ۶) سرور رسانه SFU (LiveKit) — فقط با پروفایل media ───
  # رسانه کلاس آنلاین کاملاً جدا از Next.js/Socket.IO اجرا می‌شود تا فشار
  # کلاس‌ها هرگز پیام‌رسان و بقیه امکانات را مختل نکند.
  # روی میزبان فقط دو پورت رسانه منتشر می‌شود: 7881/tcp (فالبک) و 7882/udp (RTC)
  #
  # ⚠ سازگاری با ایمیج livekit/livekit-server:v1.13.9 (بررسی‌شده از رجیستری):
  #   ENTRYPOINT ایمیج خودِ باینری «/livekit-server» است — هر «command:» به‌عنوان
  #   آرگومان باینری تفسیر می‌شود. پس entrypoint را به sh سندباکسِ alpine تغییر
  #   می‌دهیم و بعد باینری را صریح exec می‌کنیم (تست‌شده: بدون این کار سرور با
  #   «flag provided but not defined: -c» کرش‌لوپ می‌شود = قطعی استریم).
  #   IP عمومی با فلگ --node-ip (بومی باینری) پاس داده می‌شود؛ در نبود آن سرور
  #   برای تشخیص IP به STUN خارجی تکیه می‌کند که در شبکه‌های محدود شکست می‌خورد.
  livekit:
    image: livekit/livekit-server:v1.13.9
    profiles: ["media"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$${LIVEKIT_API_KEY}" ] || [ -z "$${LIVEKIT_API_SECRET}" ]; then
          echo "✘ LIVEKIT_API_KEY / LIVEKIT_API_SECRET در .env تنظیم نشده است (openssl rand)" >&2
          exit 1
        fi
        if [ -z "$${LIVEKIT_NODE_IP}" ]; then
          echo "⚠ LIVEKIT_NODE_IP تنظیم نشده — IP از شبکه محلی/STUN حدس زده می‌شود؛ برای استریم بیرونی مقدار IP عمومی VPS را در .env بگذارید" >&2
        fi
        set -- --config /etc/livekit/livekit.yaml
        if [ -n "$${LIVEKIT_NODE_IP}" ]; then
          set -- "$$@" --node-ip "$${LIVEKIT_NODE_IP}"
        fi
        export LIVEKIT_KEYS="$${LIVEKIT_API_KEY}: $${LIVEKIT_API_SECRET}"
        exec /livekit-server "$$@"
    depends_on:
      init-data:
        condition: service_completed_successfully
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # IP عمومی VPS — فقط همین سرویس آن را می‌خواند (کاندیدهای ICE رسانه)
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      # پورت‌های ضروری رسانه — جدا از درگاه وب (127.0.0.1:3034) و جدا از پورت‌های DirectAdmin
      - "7881:7881/tcp"
      - "7882:7882/udp"
    healthcheck:
      # busybox wget داخل ایمیج alpine موجود است؛ «/» پاسخ 200 می‌دهد (تست‌شده با v1.13.9)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

  # ─── ۷) TURN برای شبکه‌های محدود — فقط با پروفایل turn (اختیاری) ───
  # TURN مسیر اضطراری رسانه است؛ جایگزین SFU نیست.
  # نام کاربری/رمز و IP عمومی و TLS همه از .env به «سرویس coturn» پاس می‌شود:
  #   LIVE_TURN_USERNAME / LIVE_TURN_CREDENTIAL / TURN_EXTERNAL_IP / TURN_REALM
  #   TURN_CERT_FILE / TURN_KEY_FILE  (فایل‌ها: deploy/coturn/ — سوار روی /etc/coturn)
  # همان زوج نام‌کاربری/رمز به کلاینت‌ها هم از /api/live-sessions/[id]/token می‌رسد.
  coturn:
    image: coturn/coturn:4.18-alpine
    profiles: ["turn"]
    # ⚠ تگ 4.6-alpine در رجیستری وجود ندارد (بررسی‌شده)؛ 4.18-alpine تگ فعلی رده 4 است.
    # ENTRYPOINT ایمیج «docker-entrypoint.sh» است که با sh سندباکس جایگزین می‌شود
    # تا گارد اعتبارنامه + آرگومان‌های شرطی (IP عمومی/TLS) داخل کانتینر اجرا شوند.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$${LIVE_TURN_USERNAME}" ] || [ -z "$${LIVE_TURN_CREDENTIAL}" ]; then
          echo "✘ برای پروفایل turn باید LIVE_TURN_USERNAME و LIVE_TURN_CREDENTIAL در .env تنظیم شود" >&2
          exit 1
        fi
        set -- /usr/bin/turnserver -n --log-file=stdout --pidfile=/tmp/turnserver.pid
        set -- "$$@" --listening-port=3478 --tls-listening-port=5349 --listening-ip=0.0.0.0
        set -- "$$@" --realm="$${TURN_REALM:-daniar}" --no-cli --fingerprint --lt-cred-mech
        set -- "$$@" --min-port=49160 --max-port=49200
        set -- "$$@" --user="$${LIVE_TURN_USERNAME}:$${LIVE_TURN_CREDENTIAL}"
        if [ -n "$${TURN_EXTERNAL_IP}" ]; then
          set -- "$$@" --external-ip="$${TURN_EXTERNAL_IP}"
        else
          echo "⚠ TURN_EXTERNAL_IP تنظیم نشده — رله با IP داخلی کانتینر تبلیغ می‌شود و از بیرون کار نمی‌کند؛ IP عمومی VPS را در .env بگذارید" >&2
        fi
        if [ -n "$${TURN_CERT_FILE}" ] && [ -n "$${TURN_KEY_FILE}" ] && [ -f "$${TURN_CERT_FILE}" ] && [ -f "$${TURN_KEY_FILE}" ]; then
          set -- "$$@" --cert="$${TURN_CERT_FILE}" --key="$${TURN_KEY_FILE}"
          echo "[coturn] TURN/TLS فعال است (پورت 5349)"
        else
          set -- "$$@" --no-tls --no-dtls
          echo "[coturn] گواهی TLS تنظیم نشده — پورت 5349 غیرفعال؛ فایل‌ها را در deploy/coturn بگذارید و TURN_CERT_FILE/TURN_KEY_FILE را در .env تنظیم کنید" >&2
        fi
        echo "[coturn] راه‌اندازی turnserver — realm=$${TURN_REALM:-daniar} رله=49160-49200/udp"
        exec "$$@"
    environment:
      # متغیرهای TURN فقط متعلق به همین سرویس‌اند (قبلاً فقط در فرمان interpolate می‌شدند
      # و داخل کانتینر خالی بودند = coturn هرگز بالا نمی‌آمد)
      LIVE_TURN_USERNAME: ${LIVE_TURN_USERNAME:-}
      LIVE_TURN_CREDENTIAL: ${LIVE_TURN_CREDENTIAL:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_REALM: ${TURN_REALM:-daniar}
      TURN_CERT_FILE: ${TURN_CERT_FILE:-}
      TURN_KEY_FILE: ${TURN_KEY_FILE:-}
    volumes:
      # گواهی‌های TURN/TLS (اختیاری): cert.pem / key.pem در deploy/coturn
      - ./deploy/coturn:/etc/coturn:ro
    ports:
      # پورت‌های ضروری رسانه TURN — جدا از درگاه وب و پورت‌های DirectAdmin
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"
    healthcheck:
      # busybox nc داخل ایمیج alpine موجود است
      test: ["CMD", "nc", "-z", "127.0.0.1", "3478"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

volumes:
  daniar_data:
    name: daniar_data
