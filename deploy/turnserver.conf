# ─── پیکربندی مرجع coturn برای دانیار ───
# TURN مسیر اضطراری رسانه برای شبکه‌های محدود/ NAT سخت است؛ جایگزین SFU نیست.
#
# ⚠ این فایل صرفاً مستند پارامترهاست؛ فرمان واقعی اجرا داخل docker-compose.yml
#   (سرویس coturn) نوشته شده تا همه مقادیر متغیر از .env به «سرویس coturn» برسد:
#
#   LIVE_TURN_USERNAME / LIVE_TURN_CREDENTIAL   ← نام کاربری/رمز TURN (الزامی با پروفایل turn؛
#                                                 همان زوج به کلاینت‌ها از /api/live-sessions/[id]/token می‌رسد)
#   TURN_EXTERNAL_IP                            ← IP عمومی VPS (الزامی برای کارکرد از بیرون؛ deploy.sh الزام می‌کند)
#   TURN_REALM                                  ← دامنه احراز (پیش‌فرض daniar)
#   TURN_CERT_FILE / TURN_KEY_FILE              ← گواهی TLS (اختیاری؛ deploy/coturn روی /etc/coturn سوار می‌شود)
#
# پورت‌های روی میزبان (جدا از درگاه وب 127.0.0.1:3034 و پورت‌های DirectAdmin):
#   3478/udp+tcp   ← STUN/TURN
#   5349/tcp+udp   ← TURN over TLS/DTLS (فقط وقتی گواهی تنظیم شده باشد)
#   49160-49200/udp← بازه رله (کوچک؛ برای ده‌ها کلاس هم‌زمان کافی است)
#
# معادل آرگومان‌های اجرایی (تولیدشده در compose):
#   turnserver -n --log-file=stdout --pidfile=/tmp/turnserver.pid
#     --listening-port=3478 --tls-listening-port=5349 --listening-ip=0.0.0.0
#     --realm=<TURN_REALM> --no-cli --fingerprint --lt-cred-mech
#     --min-port=49160 --max-port=49200
#     --user=<LIVE_TURN_USERNAME>:<LIVE_TURN_CREDENTIAL>
#     --external-ip=<TURN_EXTERNAL_IP>        (اگر تنظیم شده باشد)
#     --cert=… --key=…                        یا  --no-tls --no-dtls
