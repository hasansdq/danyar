# ─── درگاه داخلی دانیار (کانتینر proxy) ───
# تنها ورودی پروژه: روی میزبان فقط 127.0.0.1:3034 منتشر می‌شود.
# DirectAdmin (Nginx/Apache) تمام درخواست‌های دامنه — HTTP، WebSocket و آپلود —
# را به همین درگاه می‌فرستد؛ سرویس‌های web و socket فقط در شبکه داخلی Docker هستند.

# DNS داخلی Docker — نام سرویس‌ها در زمان اجرا resolve می‌شود
# (restart کانتینرها با IP جدید هرگز پراکسی را خاکستری نمی‌کند)
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket — هدر Upgrade فقط وقتی کلاینت خواسته باشد
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# اسکیمای واقعی کاربر: پراکسی DirectAdmin آن را در X-Forwarded-Proto می‌فرستد
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# ⚠ قاعده ارث‌بری nginx: با تعریف حتی یک proxy_set_header داخل location،
# همه proxy_set_headerهای سطح server در آن location بی‌اثر می‌شوند.
# پس مجموعه کامل هدرها (Host/Forwarded) باید داخل هر location تکرار شود —
# مخصوصاً /socket.io/ و /rtc وگرنه Host به نام سرویس داخلی (socket:3003)
# تبدیل می‌شود و کوکی/URL سیگنالینگ خراب می‌شود.

server {
    listen 8080;
    server_name _;

    # آپلود فایل‌ها: سقف واقعی برنامه ویدئو ۵۰MB است + سربار کدگذاری
    client_max_body_size 64m;
    client_body_timeout 120s;
    keepalive_timeout 75s;

    proxy_http_version 1.1;

    # ─── Socket.IO: پیام‌رسان بلادرنگ + رویدادهای جلسه (WebSocket) ───
    location /socket.io/ {
        set $socket_upstream socket:3003;
        proxy_pass http://$socket_upstream;
        # Host و forwarded — کامل داخل این مسیر (ارسال با پورت واقعی $http_host)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # ارتقای WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ─── LiveKit SFU: سیگنالینگ رسانه کلاس آنلاین (WebSocket) ───
    # روی همان درگاه و SSL دامنه — بدون هیچ تغییری در پورت‌ها/تنظیمات DirectAdmin؛
    # رسانه خودش از پورت‌های جدا (7882/udp، 7881/tcp) و TURN عبور می‌کند
    location /rtc {
        set $livekit_upstream livekit:7880;
        proxy_pass http://$livekit_upstream;
        # Host و forwarded — کامل داخل این مسیر (الگوی livekit-client به این
        # هدرها برای مبدأ wss و بازاتصال مجدد نیاز دارد)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # ارتقای WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # APIهای مدیریتی LiveKit — فقط مصرف داخلی (RoomService از سرویس‌های پروژه)
    location /twirp {
        set $livekit_upstream livekit:7880;
        proxy_pass http://$livekit_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ─── Next.js: صفحات، API، آپلود و دانلود فایل‌ها ───
    location / {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        # این location هیچ proxy_set_header محلی ندارد → مجموعه سطح server را ارث می‌برد
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # درخواست‌های طولانی: دستیار هوش مصنوعی، ایمپورت اکسل، بکاپ
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
