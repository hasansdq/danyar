# ─────────────────────────────────────────────────────────────────
# قالب DirectAdmin — Custom HTTPD (Apache) برای دامنه دانیار
# کل ترافیک دامنه (HTTP + WebSocket + آپلود + سیگنالینگ رسانه) به تنها
# درگاه پروژه روی 127.0.0.1:3034 هدایت می‌شود.
# پورت‌های 80/443 و پنل DirectAdmin دست‌نخورده می‌مانند.
# پیش‌نیاز ماژول‌ها: proxy, proxy_http, proxy_wstunnel, headers
#
# ⚠ مسیرهای خاص (/socket.io/ و /rtc و /twirp) باید «قبل از» ProxyPass عمومی
#   «/» بیایند — در Apache اولین تطابق برنده است.
# ⚠ /rtc = سیگنالینگ WebSocket کلاس آنلاین (LiveKit SFU) — بدون قاعده wstunnel
#   آن، اتصال کلاس آنلاین در لایه Apache رد می‌شود.
# ─────────────────────────────────────────────────────────────────

# WebSocket (پیام‌رسان بلادرنگ + سیگنالینگ کلاس آنلاین)
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/socket\.io/(.*)$ ws://127.0.0.1:3034/socket.io/$1 [P,L]
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/rtc(/.*)?$ ws://127.0.0.1:3034/rtc$1 [P,L]

# HTTP معمولی (صفحات، API، آپلود، دانلود)
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https" expr=%{HTTPS}==on
ProxyPass /socket.io/ http://127.0.0.1:3034/socket.io/ connectiontimeout=20 timeout=86400 keepalive=On
ProxyPassReverse /socket.io/ http://127.0.0.1:3034/socket.io/
# سیگنالینگ رسانه کلاس آنلاین (اتصال طولانی WebSocket)
ProxyPass /rtc http://127.0.0.1:3034/rtc connectiontimeout=20 timeout=86400 keepalive=On
ProxyPassReverse /rtc http://127.0.0.1:3034/rtc
# APIهای مدیریتی LiveKit (RoomService سمت سرور پروژه)
ProxyPass /twirp http://127.0.0.1:3034/twirp connectiontimeout=20 timeout=60 keepalive=On
ProxyPassReverse /twirp http://127.0.0.1:3034/twirp
ProxyPass / http://127.0.0.1:3034/ connectiontimeout=20 timeout=3600 keepalive=On
ProxyPassReverse / http://127.0.0.1:3034/

# آپلود فایل‌ها — سقف واقعی برنامه ویدئو ۵۰MB است + سربار
LimitRequestBody 67108864
ProxyTimeout 3600
