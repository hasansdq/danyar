# ─────────────────────────────────────────────────────────────────
# قالب DirectAdmin — Custom HTTPD (Nginx) برای دامنه دانیار
# کل ترافیک دامنه (HTTP + WebSocket + آپلود + سیگنالینگ رسانه) به تنها
# درگاه پروژه روی 127.0.0.1:3034 هدایت می‌شود.
# پورت‌های 80/443 و پنل DirectAdmin دست‌نخورده می‌مانند.
# محل قرار دادن: DirectAdmin → Account Manager / Admin level →
#   Custom HTTPD Configurations → دامنه → کلیپ در سرور block اصلی
#
# ⚠ مسیر /rtc (سیگنالینگ LiveKit) و /twirp (مدیریت اتاق‌ها) هم باید پروکسی
#   شوند وگرنه اتصال WebSocket کلاس آنلاین در لایه DirectAdmin رد می‌شود.
# ⚠ مثل مسیر /socket.io/، مجموعه کامل هدرهای Host/Forwarded داخل هر مسیر
#   تکرار می‌شود (ارسال با $http_host تا پورت پشت پروکسی حفظ شود).
# ─────────────────────────────────────────────────────────────────

location /socket.io/ {
    proxy_pass http://127.0.0.1:3034;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
}

# سیگنالینگ کلاس آنلاین (WebSocket به LiveKit SFU)
location /rtc {
    proxy_pass http://127.0.0.1:3034;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
}

# APIهای مدیریتی LiveKit (RoomService سمت سرور پروژه)
location /twirp {
    proxy_pass http://127.0.0.1:3034;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60;
    proxy_buffering off;
}

location / {
    proxy_pass http://127.0.0.1:3034;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # آپلود فایل‌ها (سقف برنامه: ویدئو ۵۰MB + سربار)
    client_max_body_size 64m;
    client_body_timeout 120s;
    # درخواست‌های طولانی (دستیار AI، ایمپورت اکسل، دانلود فایل‌های بزرگ)
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
}
